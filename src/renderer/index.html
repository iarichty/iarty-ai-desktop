<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'"
        />
        <title>IARTY AI Desktop</title>
        <script>
            // Pre-paint theme so there is no flash of the wrong colours.
            (function () {
                try {
                    var saved = localStorage.getItem('iarty-desktop-theme');
                    var dark =
                        saved === 'dark' ||
                        (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
                    document.documentElement.classList.add(dark ? 'dark' : 'light');
                    document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
                } catch (e) {
                    document.documentElement.classList.add('dark');
                }
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
