name: Release

# Build installers for all platforms and attach them to a GitHub Release.
# Trigger by pushing a version tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
on:
    push:
        tags:
            - 'v*.*.*'
    # Allow manual runs from the Actions tab.
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      platform: linux
                    - os: windows-latest
                      platform: win
                    - os: macos-latest
                      platform: mac

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Build & publish installers
              env:
                  # electron-builder publishes to GitHub Releases using this token.
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Deployment URLs are injected at build time. Override these
                  # repo/environment variables to point at your own backend;
                  # the defaults below are the public IARTY endpoints.
                  MAIN_VITE_ACCOUNT_API_URL: ${{ vars.MAIN_VITE_ACCOUNT_API_URL || 'https://backend.iarty.biz.id/api' }}
                  MAIN_VITE_AI_API_URL: ${{ vars.MAIN_VITE_AI_API_URL || 'https://backend-ai.iarty.biz.id/api' }}
                  MAIN_VITE_WEB_APP_URL: ${{ vars.MAIN_VITE_WEB_APP_URL || 'https://ai.iarty.biz.id' }}
              run: npm run release -- --${{ matrix.platform }}
