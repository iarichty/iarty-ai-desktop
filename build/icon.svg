<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    IARTY mark — a diamond built from two mirrored chevron strokes (left "<"
    and right ">") that do not meet, with a filled square at the centre.
  -->
  <!-- Left chevron "<": top apex → left vertex → bottom apex -->
  <path d="M512 168
           L 168 512
           L 512 856
           L 594 774
           L 332 512
           L 594 250 Z"
        fill="#000000"/>
  <!-- Right chevron ">": upper → right vertex → lower -->
  <path d="M636 292
           L 554 374
           L 690 510
           L 554 646
           L 636 728
           L 854 510 Z"
        fill="#000000"/>
  <!-- Central filled square -->
  <rect x="450" y="450" width="124" height="124" fill="#000000"/>
</svg>
